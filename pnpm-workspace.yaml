packages:
  - "apps/*"
  - "packages/*"

# Every external dependency version, referenced as `catalog:` from the
# manifests. Update everything with `pnpm up --latest -r`, which rewrites only
# this file and the lockfile, so `git diff pnpm-workspace.yaml` is the whole
# version-change review surface.
#
# Not here: `@repo/*` deps (stay `workspace:*`). Scoped keys must be
# double-quoted.
catalog:
  "@fontsource/barlow-condensed": 5.3.0
  "@playwright/test": 1.63.0
  # Held on the Node 24 line to match `.nvmrc` (see `updateConfig` below).
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/service-worker-mock": 2.0.4
  "@vitejs/plugin-react": 6.1.1
  drizzle-kit: 0.31.10
  # D1 access. packages/db owns the schema; apps/api reads it and apps/jobs
  # writes it, so all three must agree on one query builder.
  drizzle-orm: 0.45.2
  fast-xml-parser: 5.11.1
  hono: 4.13.7
  jsdom: 30.0.1
  knip: 6.41.0
  motion: 13.2.0
  oxfmt: 0.72.0
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2003
  playwright: 1.63.0
  react: 19.3.0
  react-dom: 19.3.0
  turbo: 2.11.7
  # `typescript` is the native (Go) compiler; its binary is still `tsc`.
  typescript: 7.0.2
  vite: 8.3.0
  vite-bundle-analyzer: 1.3.9
  vitest: 5.0.0
  # apps/api and apps/jobs generate `worker-configuration.d.ts` from the same
  # runtime; apps/ui deploys to Pages with it, so that deploy also uses the
  # locked tree and the overrides below.
  wrangler: 4.130.0
  # Schemas shared across the API boundary. Declared in packages/types and
  # used directly by apps/api (request validation) and apps/jobs (feed parsing).
  zod: 4.6.1
  zx: 8.8.5

# Skipped by `pnpm up --latest`. `@types/node` must track the Node major in
# `.nvmrc`, so bump it by hand within that line.
updateConfig:
  ignoreDependencies:
    - "@types/node"

# Routes `pnpm add` / `pnpm update <pkg>` into the catalog and fails a version
# that conflicts with an entry, instead of silently pinning one package away
# from the rest. NOTE: it acts on those commands only — a plain `pnpm install`
# never evaluates it — so it is an authoring guardrail, not a CI-enforced
# invariant. A hand-written version in a package.json will still install.
catalogMode: strict

# Exact versions only, no `^`/`~`. pnpm reads these from here — it ignores
# them in `.npmrc`, which now only carries auth and registry settings.
saveExact: true
savePrefix: ""

# Security overrides for transitive dependencies (Dependabot alerts).
overrides:
  # drizzle-kit still pulls esbuild 0.18 through @esbuild-kit.
  "esbuild@0.18": 0.25.12
  # miniflare (via wrangler) pins sharp 0.35.2 exactly.
  "sharp@0.35.2": 0.35.4

allowBuilds:
  # Vite, Vitest, drizzle-kit and wrangler all bundle through esbuild, whose
  # install script links the platform binary.
  esbuild: true
  # Pulled in by miniflare for local image bindings. Its install script only
  # compiles libvips from source as a fallback; the prebuilt binary arrives
  # through the `@img/sharp-*` optional dependencies, so it stays denied.
  sharp: false
  # The workerd runtime behind `wrangler dev` and miniflare. Its install script
  # verifies the platform binary that `wrangler dev` executes.
  workerd: true

# 14 days, in minutes. A newly published version is not resolvable until it has
# been on the registry this long, which blunts the compromised-release window.
#
# Consequence worth knowing: "latest" now means "newest stable at least 14 days
# old", so `pnpm up --latest` will deliberately skip a fresh release and pick it
# up on a later run. Use `minimumReleaseAgeExclude` if one package genuinely
# needs to move faster.
minimumReleaseAge: 20160

# Fails when a version has weaker trust evidence (provenance, trusted
# publishing) than an earlier one, the usual sign of a hijacked account.
# Also re-checked on `--frozen-lockfile` installs. If a downgrade is
# legitimate, exclude that exact version in `trustPolicyExclude` with a reason,
# never a bare package name.
trustPolicy: no-downgrade

name: Main branch CI

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A *running* main run (which may be deploying) is never cancelled; a
  # *pending* one is still replaced by a newer push.
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository]

  # Deploys run once every check passed. The real security boundary is the
  # `production` environment's deployment-branch rule (main only).
  migrate-jobs-d1:
    name: migrate-jobs-d1
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Run D1 remote migrations for Jobs
        run: pnpm --filter rehoboam-jobs db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    name: deploy-api
    needs: [migrate-jobs-d1]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Deploy Rehoboam API to Cloudflare Workers
        run: pnpm --filter rehoboam-api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-jobs:
    name: deploy-jobs
    needs: [migrate-jobs-d1]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Deploy Rehoboam Jobs to Cloudflare Workers
        run: pnpm --filter rehoboam-jobs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-ui:
    name: deploy-ui
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Build
        run: pnpm --filter rehoboam-ui build

      - name: Deploy Rehoboam UI to Cloudflare Pages
        run: pnpm --filter rehoboam-ui run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
